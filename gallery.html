<!doctype html>
<html lang="ka">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#20231c" />

    <title>გალერეა | Khutorok City</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div id="site-header"></div>

    <main>
      <section class="inner-hero gallery-bg">
        <div class="container">
          <p class="eyebrow" data-i18n="galleryEyebrow">ჩვენი გალერეა</p>

          <h1 data-i18n="galleryTitle">შეიგრძენი ჩვენი ატმოსფერო</h1>

          <p data-i18n="galleryText">
            ინტერიერის დეტალები, თბილი გარემო და მომენტები, რომლებიც
            გვაერთიანებს.
          </p>
        </div>
      </section>

      <section class="section">
        <div class="container gallery-grid full-gallery">
          <img
            src="images/restaurant-exterior-day.jpg"
            alt="რესტორნის ექსტერიერი დღისით"
          />

          <img src="images/interior-main.jpg" alt="რესტორნის ინტერიერი" />

          <img src="images/interior-tables.jpg" alt="რესტორნის მაგიდები" />

          <img src="images/decoration-mugs.jpg" alt="დეკორაცია" />

          <img
            src="images/restaurant-exterior-night.jpg"
            alt="რესტორნის ექსტერიერი ღამით"
          />

          <img src="images/interior-hall.jpg" alt="რესტორნის დარბაზი" />
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script src="js/script.js"></script>
  </body>
</html>
